<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เมนูอาหาร — ป่าป่ะ Fine Dining</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Serif+Thai:wght@300;400;600;700&family=Noto+Serif+SC:wght@300;400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #140505;
    --deep: #0a0202;
    --card: #240a0a;
    --card-hover: #330e0e;
    --red: #c0392b;
    --red-bright: #e74c3c;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --cream: #f5e6d3;
    --text: #e8ddd0;
    --muted: #a8948b;
    --border: rgba(192, 57, 43, 0.3);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background-color: var(--bg-main);
    background-image: radial-gradient(circle at top center, #2e0808 0%, #0a0202 100%);
    background-size: cover;
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Noto Serif Thai', 'Noto Serif SC', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content:'';
    position:fixed;
    inset:0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
    pointer-events:none;
    z-index:0;
  }

  /* ── Top Bar ── */
  .top-bar {
    position: fixed;
    top: 16px; right: 16px;
    display: flex;
    gap: 6px;
    z-index: 50;
  }
  .lang-btn {
    background: rgba(20,5,5,0.8);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 11px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: sans-serif;
  }
  .lang-btn.active {
    background: var(--red);
    color: #fff;
    border-color: var(--red);
    font-weight: bold;
  }

  /* ── Hero ── */
  .hero {
    position: relative;
    padding: 90px 24px 40px;
    text-align: center;
    overflow: hidden;
    z-index: 1;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -100px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 400px;
    background: radial-gradient(ellipse, rgba(192,57,43,0.2) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-ornament {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    letter-spacing: 6px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 16px;
    opacity: .9;
  }
  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(38px, 8vw, 72px);
    font-weight: 900;
    line-height: 1;
    color: #fff;
    letter-spacing: -1px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .hero-sub {
    font-size: 14px;
    color: var(--muted);
    margin-top: 16px;
    letter-spacing: 1px;
  }

  /* ── Category Nav ── */
  .categories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 10px 20px 30px;
    scrollbar-width: none;
    justify-content: center;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }
  .categories::-webkit-scrollbar { display:none; }
  .cat-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--cream);
    padding: 8px 20px;
    border-radius: 50px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: all .25s;
    white-space: nowrap;
  }
  .cat-btn:hover, .cat-btn.active {
    background: var(--red);
    color: #fff;
    border-color: var(--red-bright);
    font-weight: 600;
    box-shadow: 0 4px 15px rgba(192,57,43,0.4);
  }

  /* ── Menu Grid ── */
  .menu-container { position: relative; z-index: 1; }
  .section-title {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 24px 20px 16px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .section-title h2 {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--gold-light);
    white-space: nowrap;
  }
  .section-title-line {
    flex:1;
    height:1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    padding: 0 20px 40px;
    max-width: 1100px;
    margin: 0 auto;
  }

  /* ── Menu Card ── */
  .menu-card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 16px;
    overflow: hidden;
    transition: all .3s cubic-bezier(.25,.8,.25,1);
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .menu-card:hover {
    transform: translateY(-4px);
    background: var(--card-hover);
    border-color: var(--border);
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
  }
  .card-img-wrap {
    position: relative;
    height: 220px;
    background: var(--deep);
    overflow: hidden;
  }
  .card-img-wrap img {
    width:100%; height:100%;
    object-fit: cover;
    transition: transform .5s ease;
  }
  .menu-card:hover .card-img-wrap img { transform: scale(1.05); }
  .card-img-placeholder {
    width:100%; height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    background: rgba(0,0,0,0.2);
  }
  .card-img-placeholder svg { opacity:.4; color: var(--red); }
  .card-img-placeholder p { font-size:12px; color: var(--muted); }
  .card-img-overlay {
    position:absolute;
    inset:0;
    background: linear-gradient(to top, var(--card) 0%, transparent 60%);
  }
  .card-badge {
    position:absolute;
    top:12px; right:12px;
    background: var(--red);
    color: #fff;
    font-size:11px;
    padding:4px 12px;
    border-radius:50px;
    font-weight:700;
    box-shadow: 0 4px 12px rgba(192,57,43,0.4);
    z-index: 2;
  }
  .card-body {
    padding: 0 20px 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
    margin-top: -20px;
  }
  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    line-height: 1.3;
    margin-bottom: 4px;
  }
  .card-name-sub {
    font-size: 13px;
    color: var(--gold-light);
    margin-bottom: 12px;
  }
  .card-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 20px;
    flex: 1;
  }
  .card-footer {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top: auto;
  }
  .card-price {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--cream);
  }
  .card-price span {
    font-size:13px;
    font-weight:400;
    color:var(--muted);
    margin-left:4px;
  }

  /* ── Admin Dashboard ── */
  #adminView {
    padding: 40px 20px;
    max-width: 1000px;
    margin: 0 auto;
    animation: fadeIn 0.3s ease;
    position: relative;
    z-index: 1;
  }
  .admin-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .admin-topbar h2 { color: var(--red-bright); font-family: 'Playfair Display', serif; font-size: 28px; }
  .admin-btn-back {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--cream);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
    font-family: inherit;
    font-size: 14px;
  }
  .admin-btn-back:hover { background: var(--card-hover); border-color: var(--red); }
  .admin-header-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .admin-header-actions h3 { color: #fff; font-size: 16px; }
  .admin-table-wrap {
    overflow-x: auto;
    background: var(--card);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .admin-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; min-width: 500px; }
  .admin-table th { background: rgba(0,0,0,0.3); color: var(--gold-light); padding: 16px; font-weight: 600; white-space: nowrap; }
  .admin-table td { padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--text); vertical-align: middle; }
  .admin-table tr:last-child td { border-bottom: none; }
  .admin-table tr:hover td { background: rgba(255,255,255,0.02); }
  .admin-thumb { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; display: block; }
  .admin-thumb-placeholder {
    width: 50px; height: 50px; border-radius: 8px;
    background: rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 10px; text-align: center; line-height: 1.3;
  }
  .admin-actions-cell { display: flex; gap: 8px; }
  .admin-tbl-btn {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    white-space: nowrap;
  }
  .admin-tbl-btn.edit:hover { background: var(--red); border-color: var(--red-bright); }
  .admin-tbl-btn.delete:hover { background: var(--red-bright); border-color: var(--red-bright); }

  /* ── Add Item Btn ── */
  .add-item-btn {
    background: rgba(192,57,43,0.08);
    border: 1.5px dashed var(--red);
    color: var(--red-bright);
    padding: 10px 22px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all .25s;
    white-space: nowrap;
  }
  .add-item-btn:hover { background: rgba(192,57,43,0.18); }

  /* ── Modals ── */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn .2s ease;
  }
  .modal-bg.hidden { display: none; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 30px;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  }
  .modal::-webkit-scrollbar { width: 5px; }
  .modal::-webkit-scrollbar-thumb { background: var(--red); border-radius: 3px; }
  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--red-bright);
    margin-bottom: 22px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding-bottom: 14px;
    padding-right: 30px;
  }
  .modal-close {
    position: absolute;
    top: 22px; right: 22px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
  }
  .modal-close:hover { color: #fff; }

  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 11px; color: var(--gold-light); margin-bottom: 7px; letter-spacing: 0.5px; }
  .form-input, .form-textarea, .form-select {
    width: 100%;
    background: var(--deep);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    padding: 11px 13px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--red); }
  .form-select option { background: #1a0606; }
  .form-textarea { resize: vertical; min-height: 70px; }

  .lang-group {
    background: rgba(0,0,0,0.2);
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .lang-group-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .lang-group .form-group:last-child { margin-bottom: 0; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .modal-img-upload {
    border: 2px dashed rgba(192,57,43,0.4);
    border-radius: 12px;
    height: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    background: rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .modal-img-upload:hover { border-color: var(--red); }
  .modal-img-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .modal-img-upload p { font-size: 12px; color: var(--muted); pointer-events: none; }
  .modal-preview {
    width: 100%; height: 100%;
    object-fit: cover;
    position: absolute;
    inset: 0;
    display: none;
    pointer-events: none;
  }
  .modal-save {
    width: 100%;
    background: var(--red);
    border: none;
    color: #fff;
    padding: 15px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: all .2s;
    font-family: inherit;
  }
  .modal-save:hover { background: var(--red-bright); transform: translateY(-1px); }

  /* ── Confirm / Login Modal ── */
  .small-modal {
    background: var(--card);
    padding: 28px;
    border-radius: 16px;
    text-align: center;
    border: 1px solid var(--border);
    max-width: 340px;
    width: 100%;
  }
  .small-modal h3 { color: #fff; margin-bottom: 10px; font-family: 'Playfair Display', serif; }
  .small-modal p { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .confirm-btn-wrap { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
  .confirm-btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; flex: 1; font-family: inherit; font-size: 14px; transition: 0.2s; }
  .btn-cancel { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.15); }
  .btn-cancel:hover { background: rgba(255,255,255,0.14); }
  .btn-del { background: var(--red-bright); color: #fff; }
  .btn-del:hover { background: #c0392b; }
  .btn-submit { background: var(--red); color: #fff; }
  .btn-submit:hover { background: var(--red-bright); }

  /* ── Footer ── */
  .footer {
    text-align: center;
    padding: 40px 20px;
    border-top: 1px solid rgba(255,255,255,0.05);
    margin-top: 20px;
    position: relative;
    z-index: 1;
  }
  .footer-brand { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--gold); margin-bottom: 8px; }
  .footer-copy { font-size: 11px; color: rgba(255,255,255,0.3); margin-bottom: 16px; }
  .admin-toggle {
    background: none;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--muted);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    transition: 0.2s;
  }
  .admin-toggle:hover { color: #fff; border-color: rgba(255,255,255,0.3); }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--red);
    color: #fff;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 600;
    z-index: 200;
    transition: transform .3s cubic-bezier(.25,.8,.25,1), opacity .3s;
    box-shadow: 0 8px 30px rgba(192,57,43,.5);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .hero { padding: 70px 16px 28px; }
    .menu-grid { grid-template-columns: 1fr; padding: 0 14px 28px; gap: 14px; }
    .form-row { grid-template-columns: 1fr; }
    .form-input, .form-textarea, .form-select { font-size: 16px; } /* Prevent iOS zoom */
    .admin-actions-cell { flex-direction: column; }
    .admin-tbl-btn { text-align: center; }
    .modal { padding: 20px; border-radius: 14px; }
    .admin-header-actions { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<!-- ══════════════ CUSTOMER VIEW ══════════════ -->
<div id="customerView">

  <div class="top-bar">
    <button class="lang-btn" data-lang="th" onclick="setLang('th')">TH</button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" data-lang="zh" onclick="setLang('zh')">中文</button>
  </div>

  <header class="hero">
    <p class="hero-ornament" id="ui-welcome"></p>
    <h1 class="hero-title">ป่าป่ะ</h1>
    <p id="ui-sub" style="color:var(--gold-light); font-style:italic; font-family:'Cormorant Garamond', serif; font-size:18px; margin-top:12px;"></p>
    <p id="ui-scan" class="hero-sub" style="margin-top:8px;"></p>
  </header>

  <nav class="categories" id="catNav"></nav>

  <main id="menuContainer" class="menu-container"></main>

  <footer class="footer">
    <p class="footer-brand">ป่าป่ะ</p>
    <p class="footer-copy" id="ui-footer"></p>
    <button class="admin-toggle" onclick="promptAdminLogin()" id="ui-admin-btn">เข้าสู่ระบบหลังบ้าน</button>
  </footer>

</div><!-- /customerView -->

<!-- ══════════════ ADMIN VIEW ══════════════ -->
<div id="adminView" style="display:none;">
  <div class="admin-topbar">
    <h2>⚙ Backoffice</h2>
    <button class="admin-btn-back" onclick="switchView('customer')" id="ui-back-btn">← กลับสู่หน้าเมนู</button>
  </div>
  <div class="admin-header-actions">
    <h3 id="ui-manage-title">จัดการรายการอาหาร</h3>
    <button class="add-item-btn" onclick="openModal()" id="ui-add-btn">+ เพิ่มเมนูใหม่</button>
  </div>
  <div class="admin-table-wrap">
    <table class="admin-table">
      <thead>
        <tr>
          <th id="th-img">รูปภาพ</th>
          <th id="th-name">ชื่อเมนู</th>
          <th id="th-cat">หมวดหมู่</th>
          <th id="th-price">ราคา</th>
          <th id="th-action">จัดการ</th>
        </tr>
      </thead>
      <tbody id="adminTableBody"></tbody>
    </table>
  </div>
</div>

<!-- ══════════════ MODAL: ADD / EDIT ══════════════ -->
<div class="modal-bg hidden" id="modal">
  <div class="modal">
    <h2 class="modal-title" id="modalTitle">เพิ่มเมนูใหม่</h2>
    <button class="modal-close" onclick="closeModal()" aria-label="Close">✕</button>

    <div class="form-group">
      <label class="form-label" id="lbl-img">รูปภาพอาหาร</label>
      <div class="modal-img-upload" id="imgUploadArea">
        <input type="file" accept="image/*" id="imgFileInput" onchange="previewModalImg(this)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="1.5" style="opacity:0.5;pointer-events:none;">
          <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
        </svg>
        <p id="lbl-upload-hint">คลิกหรือลากรูปมาวาง</p>
        <img class="modal-preview" id="modalPreview" alt="preview">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" id="lbl-price">ราคา (บาท)</label>
        <input class="form-input" id="inp-price" type="number" min="0" placeholder="0">

//  CATEGORY NAV
// ───────────────────────────────────────────────────
const CAT_ICONS = {
  all: '☰',
  tom: '🍲', pad: '🥘', tod: '🍳',
  yang: '🔥', laab: '🌶', somtum: '🥗'
};
const CAT_ORDER = ['tom','pad','tod','yang','laab','somtum'];

function renderCatNav() {
  const allBtn = `<button class="cat-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="filterCat('all')">${CAT_ICONS['all']} ${t('cat_all')}</button>`;
  const catBtns = CAT_ORDER.map(id => `
    <button class="cat-btn ${currentFilter === id ? 'active' : ''}" onclick="filterCat('${id}')">
      ${CAT_ICONS[id]} ${t('cat_' + id)}
    </button>
  `).join('');
  document.getElementById('catNav').innerHTML = allBtn + catBtns;
}

function filterCat(cat) {
  currentFilter = cat;
  renderCatNav();
  renderCustomerMenu();
}

// ───────────────────────────────────────────────────
//  CUSTOMER MENU
// ───────────────────────────────────────────────────
function renderCustomerMenu() {
  const container = document.getElementById('menuContainer');
  const list = currentFilter === 'all'
    ? menuItems
    : menuItems.filter(i => i.cat === currentFilter);

  if (list.length === 0) {
    container.innerHTML = `<p style="text-align:center;color:var(--muted);padding:50px 20px;font-size:15px;">${t('empty')}</p>`;
    return;
  }

  // Group by category
  const groups = {};
  list.forEach(item => {
    if (!groups[item.cat]) groups[item.cat] = [];
    groups[item.cat].push(item);
  });

  container.innerHTML = '';
  CAT_ORDER.forEach(cat => {
    if (!groups[cat] || !groups[cat].length) return;
    const sec = document.createElement('section');
    sec.innerHTML = `
      <div class="section-title">
        <h2>${CAT_ICONS[cat]} ${t('cat_' + cat)}</h2>
        <div class="section-title-line"></div>
      </div>
      <div class="menu-grid">${groups[cat].map(cardHTML).join('')}</div>
    `;
    container.appendChild(sec);
  });
}

function cardHTML(item) {
  const name    = item.name[currentLang] || item.name.en || item.name.th || '';
  const nameSub = currentLang === 'th' ? (item.name.en || '') : (item.name.th || '');
  const desc    = item.desc[currentLang] || item.desc.en || item.desc.th || '';

  const imgContent = item.img
    ? `<img src="${item.img}" alt="${escapeHtml(name)}" loading="lazy"><div class="card-img-overlay"></div>`
    : `<div class="card-img-placeholder">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
        </svg>
        <p>No Image</p>
       </div>`;

  return `
    <div class="menu-card">
      <div class="card-img-wrap">
        ${imgContent}
        ${item.badge ? `<div class="card-badge">Signature</div>` : ''}
      </div>
      <div class="card-body">
        <div class="card-name">${escapeHtml(name)}</div>
        ${nameSub ? `<div class="card-name-sub">${escapeHtml(nameSub)}</div>` : ''}
        <div class="card-desc">${escapeHtml(desc)}</div>
        <div class="card-footer">
          <div class="card-price">${item.price.toLocaleString()}<span>${t('currency')}</span></div>
        </div>
      </div>
    </div>`;
}

// ───────────────────────────────────────────────────
//  ADMIN TABLE

function renderAdminTable() {
  const tbody = document.getElementById('adminTableBody');
  if (menuItems.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:30px;">${t('empty')}</td></tr>`;
    return;
  }
  tbody.innerHTML = menuItems.map(item => {
    const imgEl = item.img
      ? `<img src="${item.img}" class="admin-thumb" alt="">`
      : `<div class="admin-thumb-placeholder">No<br>Img</div>`;
    return `
      <tr>
        <td>${imgEl}</td>
        <td>
          <strong style="color:#fff; display:block;">${escapeHtml(item.name.th || '-')}</strong>
          <span style="color:var(--muted);font-size:12px;">${escapeHtml(item.name.en || '-')}</span>
        </td>
        <td>${t('cat_' + item.cat)}</td>
        <td>${item.price.toLocaleString()}</td>
        <td>
          <div class="admin-actions-cell">
            <button class="admin-tbl-btn edit" onclick="openModal(${item.id})">${t('btn_edit')}</button>
            <button class="admin-tbl-btn delete" onclick="confirmDelete(${item.id})">${t('btn_del')}</button>

function switchView(view) {

    document.getElementById('customerView').style.display = 'none';
    document.getElementById('adminView').style.display = 'block';
    renderAdminTable();
  } else {
    document.getElementById('adminView').style.display = 'none';
    document.getElementById('customerView').style.display = 'block';
    renderCustomerMenu();
  }
  window.scrollTo(0, 0);

const ADMIN_PASSWORD = 'P@ssw0rd88';

function promptAdminLogin() {
  document.getElementById('inp-password').value = '';
  openBg('loginModal');
  setTimeout(() => document.getElementById('inp-password').focus(), 150);
}

function closeLoginModal() { closeBg('loginModal'); }

function verifyPassword() {
  const pwd = document.getElementById('inp-password').value;
  if (pwd === ADMIN_PASSWORD) {
    closeLoginModal();
    switchView('admin');
  } else {
    showToast(t('toast_wrong_pwd'));
    document.getElementById('inp-password').value = '';
    document.getElementById('inp-password').focus();

function openModal(id = null) {
  editingId = id;
  document.getElementById('modalTitle').textContent = id ? t('modal_edit') : t('modal_add');
  document.getElementById('btnSave').textContent = t('btn_save');
  resetModalInputs();

  if (id) {
    const item = menuItems.find(i => i.id === id);
    if (item) {
      document.getElementById('inp-price').value   = item.price;
      document.getElementById('inp-cat').value     = item.cat;
      document.getElementById('inp-name-th').value = item.name.th || '';
      document.getElementById('inp-name-en').value = item.name.en || '';
      document.getElementById('inp-name-zh').value = item.name.zh || '';
      document.getElementById('inp-desc-th').value = item.desc.th || '';
      document.getElementById('inp-desc-en').value = item.desc.en || '';
      document.getElementById('inp-desc-zh').value = item.desc.zh || '';
      if (item.img) {
        showPreview(item.img);
        modalImgData = item.img;
      }
    }
  }

  openBg('modal');
}

function closeModal() { closeBg('modal'); }

function resetModalInputs() {
  ['inp-price','inp-name-th','inp-name-en','inp-name-zh',
   'inp-desc-th','inp-desc-en','inp-desc-zh'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('inp-cat').value = 'tom';
  document.getElementById('inp-price').value = '';
  document.getElementById('imgFileInput').value = '';
  hidePreview();
  modalImgData = null;
}

function previewModalImg(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    modalImgData = e.target.result;
    showPreview(e.target.result);
  };
  reader.readAsDataURL(file);
}

function showPreview(src) {
  const prev = document.getElementById('modalPreview');
  prev.src = src;
  prev.style.display = 'block';
}
function hidePreview() {
  const prev = document.getElementById('modalPreview');
  prev.style.display = 'none';
  prev.src = '';
}

function saveItem() {
  const price  = parseFloat(document.getElementById('inp-price').value);
  const cat    = document.getElementById('inp-cat').value;
  const nameTh = document.getElementById('inp-name-th').value.trim();
  const nameEn = document.getElementById('inp-name-en').value.trim();

  if ((!nameTh && !nameEn) || isNaN(price) || price < 0) {
    showToast(t('toast_err'));
    return;
  }

  const data = {
    cat, price, img: modalImgData, badge: false,
    name: {
      th: nameTh,
      en: nameEn,
      zh: document.getElementById('inp-name-zh').value.trim()
    },
    desc: {
      th: document.getElementById('inp-desc-th').value.trim(),
      en: document.getElementById('inp-desc-en').value.trim(),
      zh: document.getElementById('inp-desc-zh').value.trim()
    }
  };

  if (editingId) {
    const idx = menuItems.findIndex(i => i.id === editingId);
    if (idx > -1) menuItems[idx] = { ...menuItems[idx], ...data };
  } else {
    data.id = Date.now();
    menuItems.push(data);
  }

  closeModal();
  if (currentView === 'admin') renderAdminTable();
  else renderCustomerMenu();
  showToast(t('toast_save'));
}

// ───────────────────────────────────────────────────
//  DELETE
// ───────────────────────────────────────────────────
function confirmDelete(id) {
  itemToDelete = id;
  openBg('confirmModal');
}
function closeConfirm() { itemToDelete = null; closeBg('confirmModal'); }
function executeDelete() {
  if (itemToDelete !== null) {
    menuItems = menuItems.filter(i => i.id !== itemToDelete);
    if (currentView === 'admin') renderAdminTable();
    else renderCustomerMenu();
    showToast(t('toast_del'));
  }
  closeConfirm();
}

// ───────────────────────────────────────────────────
//  UTILS
// ───────────────────────────────────────────────────
function openBg(id) {
  document.getElementById(id).classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}
function closeBg(id) {
  document.getElementById(id).classList.add('hidden');
  document.body.style.overflow = '';
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}

function escapeHtml(str) {
  if (!str) return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Close modal on background click
['modal','confirmModal','loginModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', function(e) {
    if (e.target === this) {
      if (id === 'modal') closeModal();
      else if (id === 'confirmModal') closeConfirm();
      else closeLoginModal();
    }
  });
});

// ───────────────────────────────────────────────────
//  INIT
// ───────────────────────────────────────────────────
setLang('th');
</script>
